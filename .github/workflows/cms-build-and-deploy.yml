name: CMS Build and Deploy

on:
  push:
    branches:
      - staging
      # cuando quieras usar main, simplemente agregas:
      # - main

env:
  IMAGE_NAME: strapi-ctrl365
  CONTAINER_APP_NAME: strapi-ctrl365
  RESOURCE_GROUP: WebCtrl365-staging
  REGISTRY: ${{ secrets.STRAPI_LOGIN_SERVER }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install buildx
        run: |
          docker buildx create --use

      - name: Calculate build number
        id: version
        run: |
          echo "BUILD_NUM=$(( ${GITHUB_RUN_NUMBER} ))" >> $GITHUB_ENV
          echo "Using version: 1.0.${GITHUB_RUN_NUMBER}"

      - name: Build and Push Docker Image
        run: |
          docker buildx build --push \
            -t ${REGISTRY}/${IMAGE_NAME}:${{ github.sha }} \
            -t ${REGISTRY}/${IMAGE_NAME}:latest \
            -t ${REGISTRY}/${IMAGE_NAME}:1.0.${BUILD_NUM} \
            .

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${CONTAINER_APP_NAME} \
            --resource-group ${RESOURCE_GROUP} \
            --image ${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}
