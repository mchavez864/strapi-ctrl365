name: CMS Build and Deploy
 
on:
  push:
    branches:
      - staging
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v3
 
      - name: Login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.STRAPI_LOGIN_SERVER }}
          username: ${{ secrets.STRAPICTRL365_REGISTRY_USERNAME }}
          password: ${{ secrets.STRAPICTRL365_REGISTRY_PASSWORD }}
 
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.STRAPI_LOGIN_SERVER }}/strapi-ctrl365:${{ github.sha }} .
 
      - name: Push Docker image
        run: |
          docker push ${{ secrets.STRAPI_LOGIN_SERVER }}/strapi-ctrl365:${{ github.sha }}
 
  deploy:
  needs: build-and-push
  runs-on: ubuntu-latest
 
  steps:
    - name: Azure Login
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.STRAPICTRL365_AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.STRAPICTRL365_AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.STRAPICTRL365_AZURE_SUBSCRIPTION_ID }}
 
      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ secrets.STRAPI_LOGIN_SERVER }}/strapi-ctrl365:${{ github.sha }}
