name: CMS Build and Deploy

on:
  push:
    branches:
      - staging

env:
  IMAGE_NAME: strapi-ctrl365
  CONTAINER_APP_NAME: strapi-ctrl365
  RESOURCE_GROUP: WebCtrl365-staging
  REGISTRY: ${{ secrets.STRAPI_LOGIN_SERVER }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Login to Azure using your Service Principal (AZURE_CREDENTIALS)
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Login to ACR using credentials regenerated from Azure
      - name: Docker Login
        run: |
          echo "${{ secrets.STRAPICTRL365_REGISTRY_PASSWORD }}" | docker login ${{ secrets.STRAPI_LOGIN_SERVER }} \
            -u ${{ secrets.STRAPICTRL365_REGISTRY_USERNAME }} --password-stdin

      - name: Setup Docker Buildx
        run: docker buildx create --use

      - name: Calculate version number
        run: echo "BUILD_NUM=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Build & Push Image
        run: |
          docker buildx build --push \
            --file Dockerfile \
            --tag ${REGISTRY}/${IMAGE_NAME}:${{ github.sha }} \
            --tag ${REGISTRY}/${IMAGE_NAME}:latest \
            --tag ${REGISTRY}/${IMAGE_NAME}:1.0.${BUILD_NUM} \
            .

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name ${CONTAINER_APP_NAME} \
            --resource-group ${RESOURCE_GROUP} \
            --image ${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}
