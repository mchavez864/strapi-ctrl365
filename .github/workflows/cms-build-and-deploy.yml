name: CMS Build & Deploy Dev (staging)

on:
  push:
    branches:
      - staging

env:
  IMAGE_NAME: ctrl365-strapi-prod
  CONTAINER_APP_NAME: ctrl365-strapi-prod
  RESOURCE_GROUP: ctrl365-web-prod
  PROD_LOGIN_SERVER: ${{ secrets.PROD_ACR_LOGIN_SERVER }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Login a Azure con service principal (JSON en AZURE_CREDENTIALS)
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.PROD_AZURE_CREDENTIALS }}

      # 2) Login al Container Registry (ACR u otro)
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PROD_LOGIN_SERVER }}
          username: ${{ secrets.PROD_ACR_USERNAME }}
          password: ${{ secrets.PROD_ACR_PASSWORD }}

      # 3) Build & Push de la imagen Docker
      #    - dev-latest  -> última versión de desarrollo
      #    - <sha>       -> tag único por commit (fuerza nueva revisión)
      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.PROD_ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:dev-latest
            ${{ env.PROD_ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NODE_ENV=production

      # 4) Deploy a Azure Container Apps usando la imagen versionada por SHA
      - name: Deploy to Azure Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.PROD_ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
              --set-env-vars \
                NODE_ENV=production \
                HOST=${{ secrets.HOST }} \
                DATABASE_CLIENT=${{ secrets.DB_CLIENT }} \
                DATABASE_HOST=${{ secrets.DB_HOST }} \
                DATABASE_PORT=${{ secrets.DB_PORT }} \
                DATABASE_NAME=${{ secrets.PROD_DB_NAME }} \
                DATABASE_USERNAME=${{ secrets.DB_USER }} \
                DATABASE_PASSWORD=${{ secrets.DB_PASSWORD }} \
                DATABASE_SSL=${{ secrets.DB_SSL }} \
                APP_KEYS=${{ secrets.PROD_APP_KEYS }} \
                API_TOKEN_SALT=${{ secrets.PROD_API_TOKEN_SALT }} \
                ADMIN_JWT_SECRET=${{ secrets.PROD_ADMIN_JWT_SECRET }} \
                JWT_SECRET=${{ secrets.PROD_JWT_SECRET }} \
                TRANSFER_TOKEN_SALT=${{ secrets.PROD_TRANSFER_TOKEN_SALT }} \
                ENCRYPTION_KEY=${{ secrets.PROD_ENCRYPTION_KEY }} \
                AZURE_ACCOUNT_NAME=${{ secrets.SA_AZURE_ACCOUNT_NAME }} \
                AZURE_ACCOUNT_KEY=${{ secrets.AZURE_ACCOUNT_KEY }} \
                AZURE_CONTAINER_NAME=${{ secrets.PROD_AZURE_CONTAINER_NAME }} \
                AZURE_DEFAULT_PATH=${{ secrets.AZURE_DEFAULT_PATH }} \
                AZURE_REMOVE_CN=${{ secrets.AZURE_REMOVE_CN }} \
                "AZURE_DEFAULT_CACHE_CONTROL=${{ secrets.AZURE_DEFAULT_CACHE_CONTROL }}"


