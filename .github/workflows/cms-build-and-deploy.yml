name: CMS Build & Deploy Dev

on:
  push:
    branches:
      - staging

env:
  IMAGE_NAME: strapi-ctrl365
  CONTAINER_APP_NAME: strapi-ctrl365
  RESOURCE_GROUP: WebCtrl365-staging
  STRAPI_LOGIN_SERVER: ${{ secrets.STRAPI_LOGIN_SERVER }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout
        uses: actions/checkout@v3

      # 2️⃣ Docker login
      - name: Docker Login
        run: |
          echo "${{ secrets.STRAPICTRL365_REGISTRY_PASSWORD }}" | docker login $STRAPI_LOGIN_SERVER \
            -u ${{ secrets.STRAPICTRL365_REGISTRY_USERNAME }} --password-stdin

      # 3️⃣ Setup Docker Buildx
      - name: Setup Docker Buildx
        run: docker buildx create --use

      # 4️⃣ Set build number
      - name: Set build number
        run: echo "BUILD_NUM=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      # 5️⃣ Build & Push Docker Image (development)
      - name: Build & Push Docker Image
        run: |
          docker buildx build --push \
            --file Dockerfile \
            --build-arg NODE_ENV=development \
            --build-arg DATABASE_HOST=${{ secrets.DATABASE_HOST }} \
            --build-arg DATABASE_NAME=${{ secrets.DATABASE_NAME }} \
            --build-arg DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }} \
            --build-arg DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
            --build-arg ADMIN_STRAPI_JWT_SECRET=${{ secrets.ADMIN_STRAPI_JWT_SECRET }} \
            --build-arg STRAPI_APP_KEYS=${{ secrets.STRAPI_APP_KEYS }} \
            --build-arg STRAPI_API_TOKEN_SALT=${{ secrets.STRAPI_API_TOKEN_SALT }} \
            --build-arg STRAPI_JWT_SECRET=${{ secrets.STRAPI_JWT_SECRET }} \
            --build-arg AZURE_ACCOUNT_NAME=${{ secrets.AZURE_ACCOUNT_NAME }} \
            --build-arg AZURE_ACCOUNT_KEY=${{ secrets.AZURE_ACCOUNT_KEY }} \
            --build-arg AZURE_CONTAINER_NAME=${{ secrets.AZURE_CONTAINER_NAME }} \
            --build-arg AZURE_DEFAULT_PATH=${{ secrets.AZURE_DEFAULT_PATH }} \
            --build-arg AZURE_REMOVE_CN=${{ secrets.AZURE_REMOVE_CN }} \
            --tag $STRAPI_LOGIN_SERVER/$IMAGE_NAME:dev-latest \
            .

      # 6️⃣ Deploy to Azure Container App
      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $STRAPI_LOGIN_SERVER/$IMAGE_NAME:dev-latest \
            --set-env-vars \
              DATABASE_CLIENT=mysql \
              DATABASE_HOST=${{ secrets.DATABASE_HOST }} \
              DATABASE_PORT=3306 \
              DATABASE_NAME=${{ secrets.DATABASE_NAME }} \
              DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }} \
              DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
              DATABASE_SSL=true \
              APP_KEYS=${{ secrets.STRAPI_APP_KEYS }} \
              API_TOKEN_SALT=${{ secrets.STRAPI_API_TOKEN_SALT }} \
              ADMIN_JWT_SECRET=${{ secrets.ADMIN_STRAPI_JWT_SECRET }} \
              JWT_SECRET=${{ secrets.STRAPI_JWT_SECRET }} \
              AZURE_ACCOUNT_NAME=${{ secrets.AZURE_ACCOUNT_NAME }} \
              AZURE_ACCOUNT_KEY=${{ secrets.AZURE_ACCOUNT_KEY }} \
              AZURE_CONTAINER_NAME=${{ secrets.AZURE_CONTAINER_NAME }} \
              AZURE_DEFAULT_PATH=${{ secrets.AZURE_DEFAULT_PATH }} \
              AZURE_REMOVE_CN=${{ secrets.AZURE_REMOVE_CN }}
