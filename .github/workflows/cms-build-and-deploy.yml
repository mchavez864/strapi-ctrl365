name: CMS Build and Deploy

on:
  push:
    branches:
      - staging

env:
  IMAGE_NAME: strapi-ctrl365
  CONTAINER_APP_NAME: strapi-ctrl365
  RESOURCE_GROUP: WebCtrl365-staging
  REGISTRY: ${{ secrets.STRAPI_LOGIN_SERVER }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout
        uses: actions/checkout@v3

      # 2️⃣ Azure Login
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3️⃣ Docker Login (ACR)
      - name: Docker Login
        run: |
          echo "${{ secrets.STRAPICTRL365_REGISTRY_PASSWORD }}" | docker login ${{ secrets.STRAPI_LOGIN_SERVER }} \
            -u ${{ secrets.STRAPICTRL365_REGISTRY_USERNAME }} --password-stdin

      # 4️⃣ Setup Docker Buildx
      - name: Setup Docker Buildx
        run: docker buildx create --use

      # 5️⃣ Calculate version number
      - name: Calculate version number
        run: echo "BUILD_NUM=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      # 6️⃣ Build Strapi Admin inside Docker image
      - name: Build Strapi Admin
        run: |
          yarn install
          yarn build

      # 7️⃣ Build & Push Docker image to ACR
      - name: Build & Push Image
        run: |
          docker buildx build --push \
            --file Dockerfile \
            --tag ${REGISTRY}/${IMAGE_NAME}:${{ github.sha }} \
            --tag ${REGISTRY}/${IMAGE_NAME}:latest \
            --tag ${REGISTRY}/${IMAGE_NAME}:1.0.${BUILD_NUM} \
            .

      # 8️⃣ Deploy to Azure Container App with all env vars
      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name ${CONTAINER_APP_NAME} \
            --resource-group ${RESOURCE_GROUP} \
            --image ${REGISTRY}/${IMAGE_NAME}:${{ github.sha }} \
            --env-vars DATABASE_CLIENT=mysql \
                        DATABASE_HOST=${{ secrets.STRAPI_DB_HOST }} \
                        DATABASE_PORT=${{ secrets.STRAPI_DB_PORT }} \
                        DATABASE_NAME=${{ secrets.STRAPI_DB_NAME }} \
                        DATABASE_USERNAME=${{ secrets.STRAPI_DB_USER }} \
                        DATABASE_PASSWORD=${{ secrets.STRAPI_DB_PASSWORD }} \
                        DATABASE_SSL=${{ secrets.STRAPI_DB_SSL }} \
                        APP_KEYS=${{ secrets.STRAPI_APP_KEYS }} \
                        API_TOKEN_SALT=${{ secrets.STRAPI_API_TOKEN_SALT }} \
                        ADMIN_JWT_SECRET=${{ secrets.STRAPI_ADMIN_JWT_SECRET }} \
                        JWT_SECRET=${{ secrets.STRAPI_JWT_SECRET }} \
                        AZURE_ACCOUNT_NAME=${{ secrets.STRAPI_AZURE_ACCOUNT_NAME }} \
                        AZURE_ACCOUNT_KEY=${{ secrets.STRAPI_AZURE_ACCOUNT_KEY }} \
                        AZURE_CONTAINER_NAME=${{ secrets.STRAPI_AZURE_CONTAINER_NAME }} \
                        AZURE_DEFAULT_PATH=${{ secrets.STRAPI_AZURE_DEFAULT_PATH }} \
                        AZURE_REMOVE_CN=${{ secrets.STRAPI_AZURE_REMOVE_CN }}

