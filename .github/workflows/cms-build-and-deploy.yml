name: CMS Build and Deploy

on:
  push:
    branches:
      - staging   # Más adelante cambiamos a "main"

env:
  ACR_NAME: stagingctrl365com
  IMAGE_NAME: strapi-ctrl365
  CONTAINER_APP_NAME: strapi-ctrl365
  RESOURCE_GROUP: WebCtrl365-staging

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name $ACR_NAME

      - name: Set Image Tags
        id: tags
        run: |
          echo "sha_tag=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "latest_tag=latest" >> $GITHUB_ENV
          VERSION_TAG="v-$(date +'%Y.%m.%d-%H%M')"
          echo "version_tag=$VERSION_TAG" >> $GITHUB_ENV

      - name: Build Docker images
        run: |
          docker build -t $ACR_NAME.azurecr.io/$IMAGE_NAME:$sha_tag .
          docker tag $ACR_NAME.azurecr.io/$IMAGE_NAME:$sha_tag \
                     $ACR_NAME.azurecr.io/$IMAGE_NAME:$latest_tag
          docker tag $ACR_NAME.azurecr.io/$IMAGE_NAME:$sha_tag \
                     $ACR_NAME.azurecr.io/$IMAGE_NAME:$version_tag

      - name: Push Docker images
        run: |
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:$sha_tag
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:$latest_tag
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:$version_tag

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:$sha_tag
