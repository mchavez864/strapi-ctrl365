name: CMS Build and Deploy Staging

on:
  push:
    branches:
      - staging

env:
  IMAGE_NAME: strapi-ctrl365
  CONTAINER_APP_NAME: strapi-ctrl365
  RESOURCE_GROUP: WebCtrl365-staging
  REGISTRY: ${{ secrets.STRAPI_LOGIN_SERVER }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout
        uses: actions/checkout@v3

      # 2️⃣ Azure Login
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3️⃣ Setup Docker Buildx
      - name: Setup Docker Buildx
        run: docker buildx create --use

      # 4️⃣ Validate required secrets
      - name: Validate required secrets
  run: |
    if [ -z "${{ secrets.STRAPICTRL365_REGISTRY_USERNAME }}" ]; then
      echo "❌ STRAPICTRL365_REGISTRY_USERNAME no está configurado"
      exit 1
    fi
    if [ -z "${{ secrets.STRAPICTRL365_REGISTRY_PASSWORD }}" ]; then
      echo "❌ STRAPICTRL365_REGISTRY_PASSWORD no está configurado"
      exit 1
    fi
    if [ -z "${{ secrets.ADMIN_STRAPI_JWT_SECRET }}" ]; then
      echo "❌ ADMIN_STRAPI_JWT_SECRET no está configurado"
      exit 1
    fi
    if [ -z "${{ secrets.STRAPI_APP_KEYS }}" ]; then
      echo "❌ STRAPI_APP_KEYS no está configurado"
      exit 1
    fi
    if [ -z "${{ secrets.STRAPI_API_TOKEN_SALT }}" ]; then
      echo "❌ STRAPI_API_TOKEN_SALT no está configurado"
      exit 1
    fi
    if [ -z "${{ secrets.STRAPI_JWT_SECRET }}" ]; then
      echo "❌ STRAPI_JWT_SECRET no está configurado"
      exit 1
    fi
    if [ -z "${{ secrets.AZURE_ACCOUNT_NAME }}" ]; then
      echo "❌ AZURE_ACCOUNT_NAME no está configurado"
      exit 1
    fi
    if [ -z "${{ secrets.AZURE_ACCOUNT_KEY }}" ]; then
      echo "❌ AZURE_ACCOUNT_KEY no está configurado"
      exit 1
    fi
    if [ -z "${{ secrets.AZURE_CONTAINER_NAME }}" ]; then
      echo "❌ AZURE_CONTAINER_NAME no está configurado"
      exit 1
    fi
    if [ -z "${{ secrets.AZURE_DEFAULT_PATH }}" ]; then
      echo "❌ AZURE_DEFAULT_PATH no está configurado"
      exit 1
    fi
    if [ -z "${{ secrets.AZURE_REMOVE_CN }}" ]; then
      echo "❌ AZURE_REMOVE_CN no está configurado"
      exit 1
    fi
          done

      # 5️⃣ Docker Login
      - name: Docker Login
        run: |
          echo "${{ secrets.STRAPICTRL365_REGISTRY_PASSWORD }}" | docker login \
            ${{ secrets.STRAPI_LOGIN_SERVER }} \
            -u ${{ secrets.STRAPICTRL365_REGISTRY_USERNAME }} \
            --password-stdin

      # 6️⃣ Calculate build number
      - name: Calculate version number
        run: echo "BUILD_NUM=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      # 7️⃣ Build & Push Docker Image
      - name: Build & Push Image
        run: |
          docker buildx build --push \
            --file Dockerfile \
            --build-arg AZURE_ACCOUNT_NAME=${{ secrets.AZURE_ACCOUNT_NAME }} \
            --build-arg AZURE_ACCOUNT_KEY=${{ secrets.AZURE_ACCOUNT_KEY }} \
            --build-arg AZURE_CONTAINER_NAME=${{ secrets.AZURE_CONTAINER_NAME }} \
            --build-arg AZURE_DEFAULT_PATH=${{ secrets.AZURE_DEFAULT_PATH }} \
            --build-arg AZURE_REMOVE_CN=${{ secrets.AZURE_REMOVE_CN }} \
            --build-arg DATABASE_CLIENT=mysql \
            --build-arg DATABASE_HOST=${{ secrets.DATABASE_HOST }} \
            --build-arg DATABASE_PORT=3306 \
            --build-arg DATABASE_NAME=${{ secrets.DATABASE_NAME }} \
            --build-arg DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }} \
            --build-arg DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
            --build-arg DATABASE_SSL=true \
            --build-arg ADMIN_STRAPI_JWT_SECRET=${{ secrets.ADMIN_STRAPI_JWT_SECRET }} \
            --build-arg STRAPI_APP_KEYS=${{ secrets.STRAPI_APP_KEYS }} \
            --build-arg STRAPI_API_TOKEN_SALT=${{ secrets.STRAPI_API_TOKEN_SALT }} \
            --build-arg STRAPI_JWT_SECRET=${{ secrets.STRAPI_JWT_SECRET }} \
            --tag ${STRAPI_LOGIN_SERVER}/${IMAGE_NAME}:${{ github.sha }} \
            --tag ${STRAPI_LOGIN_SERVER}/${IMAGE_NAME}:latest \
            --tag ${STRAPI_LOGIN_SERVER}/${IMAGE_NAME}:1.0.${BUILD_NUM} \
            .

      # 8️⃣ Deploy to Azure Container App
      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name ${CONTAINER_APP_NAME} \
            --resource-group ${RESOURCE_GROUP} \
            --image ${STRAPI_LOGIN_SERVER}/${IMAGE_NAME}:${{ github.sha }} \
            --set-env-vars \
              DATABASE_CLIENT=mysql \
              DATABASE_HOST=${{ secrets.DATABASE_HOST }} \
              DATABASE_PORT=3306 \
              DATABASE_NAME=${{ secrets.DATABASE_NAME }} \
              DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }} \
              DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
              DATABASE_SSL=true \
              STRAPI_APP_KEYS=${{ secrets.STRAPI_APP_KEYS }} \
              STRAPI_API_TOKEN_SALT=${{ secrets.STRAPI_API_TOKEN_SALT }} \
              ADMIN_STRAPI_JWT_SECRET=${{ secrets.ADMIN_STRAPI_JWT_SECRET }} \
              STRAPI_JWT_SECRET=${{ secrets.STRAPI_JWT_SECRET }} \
              AZURE_ACCOUNT_NAME=${{ secrets.AZURE_ACCOUNT_NAME }} \
              AZURE_ACCOUNT_KEY=${{ secrets.AZURE_ACCOUNT_KEY }} \
              AZURE_CONTAINER_NAME=${{ secrets.AZURE_CONTAINER_NAME }} \
              AZURE_DEFAULT_PATH=${{ secrets.AZURE_DEFAULT_PATH }} \
              AZURE_REMOVE_CN=${{ secrets.AZURE_REMOVE_CN }}

