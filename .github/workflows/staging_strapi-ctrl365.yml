# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - strapi-ctrl365

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: stagingctrl365com.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_C1BC52DE2981455E94F8CF03B879DA79 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_C05979538505435A9961914E8CE613D6 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: stagingctrl365com.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_C1BC52DE2981455E94F8CF03B879DA79 }}/strapi-ctrl365:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_070EE026C9C14B8FB038D769737E2929 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_88D7909533F2435988143CBB49C91370 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4E3C71C64A8A4229A6CC6CE85696AFC1 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'strapi-ctrl365'
          slot-name: 'Production'
          images: 'stagingctrl365com.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_C1BC52DE2981455E94F8CF03B879DA79 }}/strapi-ctrl365:${{ github.sha }}'
          